<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(80, 109, 109);
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 20px;
        }

        .board-container {
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            height: 360px;
            width: 360px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .cell {
            height: 110px;
            width: 110px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            font-size: 48px;
            background-color: rgb(236, 236, 184);
            cursor: pointer;
        }

        .cell:hover {
            background-color: rgba(249, 247, 247, 0.852);
        }

        #resetGameBtn,
        #newGameBtn {
            padding: 12px 20px;
            font-size: 18px;
            background-color: #191913;
            color: white;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .message-box {
            height: 180px;
            margin-top: 20px;
        }

        #statusMsg {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="message-box hidden">
        <p id="statusMsg">Winner</p>
        <button id="newGameBtn">New Game</button>
    </div>

    <main>
        <h1>Tic Tac Toe</h1>
        <div class="board-container">
            <div class="board">
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
                <button class="cell"></button>
            </div>
        </div>

        <button id="resetGameBtn">Reset Game</button>
    </main>

    <script src="./js_assignment3.js"></script>
</body>
</html>
