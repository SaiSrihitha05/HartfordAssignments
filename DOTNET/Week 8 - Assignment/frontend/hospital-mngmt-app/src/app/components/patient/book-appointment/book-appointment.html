<div class="booking-container">
  <div class="booking-card">
    <h2>Book an Appointment</h2>
    <p>Select a specialist and your preferred time.</p>

    @if(errorMessage){
      <div class="error-msg">{{ errorMessage }}</div>
    }
    <form (ngSubmit)="onBook()" #bookForm="ngForm">

      <div class="form-group">
        <label for="doctor">Select Doctor</label>
        <select id="doctor" name="doctorId" [(ngModel)]="appointmentData.doctorId" required>
          <option [ngValue]="0" disabled selected>Choose a doctor...</option>
          @for(doc of doctors;track doc){
            <option [ngValue]="doc.id">
              Dr. {{ doc.name }} ({{ doc.specialization }})
            </option>
          }
        </select>
      </div>
      
      <div class="form-group">
        <label for="date">Appointment Date & Time</label>
        <input 
          type="datetime-local" 
          id="date" 
          name="appointmentDate" 
          [(ngModel)]="appointmentData.appointmentDate" 
          required>
      </div>

      <button type="submit" class="btn-book" [disabled]="!bookForm.valid || appointmentData.doctorId === 0">
        Confirm Appointment
      </button>
    </form>
  </div>
</div>
