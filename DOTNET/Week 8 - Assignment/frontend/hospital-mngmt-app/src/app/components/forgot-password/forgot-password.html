<div class="auth-card">
  <h3>Reset Password</h3>
  @if(message){
    <p class="info-banner">{{ message }}</p>
  }
  
  <form (ngSubmit)="onSendRequest()" #forgotForm="ngForm">
    <input type="email" name="email" [(ngModel)]="email" required placeholder="Enter your email">
    <button type="submit" [disabled]="!forgotForm.valid || isLoading">
      Send Reset Link
    </button>
  </form>
  <a routerLink="/login">Back to Login</a>
</div>
