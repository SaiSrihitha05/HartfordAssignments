<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p>Please enter your credentials to log in.</p>

    @if(errorMessage){
      <div class="error-banner">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="loginData.email" 
          required 
          placeholder="doctor@hospital.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="loginData.password" 
          required 
          placeholder="••••••••">
      </div>

      <div class="captcha-box">
        <div class="captcha-display" id="captchaText">
          {{ captchaCode }}
        </div>
        <button type="button" class="refresh-btn" (click)="generateCaptcha()">🔄</button>
      </div>

      <div class="input-group">
        <input type="text" name="captchaInput" [(ngModel)]="userInput" (keydown.enter)="$event.preventDefault()" placeholder="Enter the code above" class="form-control">
      </div>
      <button type="submit" class="btn-primary" [disabled]="!loginForm.valid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        <p><a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a></p>
      </div>
    </form>

  </div>
</div>
